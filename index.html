<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Meelad Programme Helper</title>
<meta name="description" content="Meelad Programme Helper — Complete event management for Hidaya Madrasa Chernikode"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* ===== CSS VARIABLES ===== */
:root{
  --bg:#fafafa;--card:rgba(255,255,255,0.97);--acc:#ff8c00;--acc2:#ff3d00;--acc3:#ff5e00;
  --t1:#1a1a2e;--t2:#3d3d5c;--t3:#8888aa;
  --brd:rgba(200,200,210,0.35);--shd:0 8px 32px rgba(255,140,0,0.06);--shd2:0 4px 16px rgba(0,0,0,0.06);
  --glass:rgba(255,255,255,0.75);--blur:blur(16px);--radius:18px;--rsm:10px;
  --sw:268px;--hh:64px;--fh:48px;
  --tr:all 0.22s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#0e0e1c;--card:rgba(22,22,44,0.95);--t1:#e8e8f8;--t2:#b0b0cc;--t3:#6060a0;
  --brd:rgba(100,100,160,0.35);--shd:0 8px 32px rgba(0,0,0,0.45);--shd2:0 4px 16px rgba(0,0,0,0.35);
  --glass:rgba(22,22,44,0.75);
}

/* ===== RESET ===== */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  font-family:'Inter','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--t1);
  min-height:100vh;overflow-x:hidden;
  transition:background .3s,color .3s;
  background-image:
    radial-gradient(circle at 15% 15%,rgba(255,140,0,.03) 0%,transparent 50%),
    radial-gradient(circle at 85% 85%,rgba(255,61,0,.03) 0%,transparent 50%);
}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideRight{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInR{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes ribbonWave{0%,100%{transform:rotate(-1.5deg) scale(1)}50%{transform:rotate(1.5deg) scale(1.01)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes bounceIn{0%{transform:scale(.3);opacity:0}50%{transform:scale(1.07)}70%{transform:scale(.96)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ===== GLASS CARDS ===== */
.glass{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1.5px solid var(--brd);border-radius:var(--radius);box-shadow:var(--shd)}

/* ===== BUTTONS ===== */
button{cursor:pointer;border:none;font-family:inherit;font-size:.875rem;font-weight:600;border-radius:var(--rsm);padding:9px 18px;transition:var(--tr);letter-spacing:.01em}
button:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,0,0,.18)}
button:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));color:#fff}
.btn-danger{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}
.btn-success{background:linear-gradient(135deg,#27ae60,#16a085);color:#fff}
.btn-warning{background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff}
.btn-secondary{background:rgba(255,140,0,.1);color:var(--acc);border:1.5px solid rgba(255,140,0,.2)}
.btn-ghost{background:transparent;color:var(--t2);border:1.5px solid var(--brd)}
.btn-outline{background:transparent;border:2px solid var(--acc);color:var(--acc)}

/* ===== INPUTS ===== */
input,select,textarea{
  font-family:inherit;font-size:.875rem;font-weight:500;
  padding:11px 14px;border:1.5px solid var(--brd);border-radius:var(--rsm);
  background:var(--card);color:var(--t1);transition:var(--tr);width:100%;outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,140,0,.18)}
input[type=checkbox]{width:auto;width:16px;height:16px;accent-color:var(--acc)}
input::placeholder{color:var(--t3)}
select option{background:var(--bg);color:var(--t1)}

/* ===== HEADER ===== */
.header{
  position:sticky;top:0;z-index:100;min-height:var(--hh);
  display:flex;align-items:center;padding:10px 22px;gap:14px;
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-bottom:1.5px solid var(--brd);box-shadow:0 2px 20px rgba(255,140,0,.08)
}
.logo-img{height:40px;width:40px;border-radius:50%;object-fit:cover;box-shadow:0 2px 12px rgba(255,140,0,.25);flex-shrink:0}
.logo-placeholder{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 4px 14px rgba(255,140,0,.3);flex-shrink:0}
.header .brand{display:flex;flex-direction:column;min-width:0;flex:1 1 auto;overflow:hidden}
.header .title{font-size:1rem;font-weight:800;background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header .org{font-size:.7rem;color:var(--t3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.theme-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:var(--card);border:1.5px solid var(--brd)}
.save-badge{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:20px;background:rgba(39,174,96,.12);color:#27ae60;border:1px solid rgba(39,174,96,.25);white-space:nowrap}

/* ===== SIDEBAR ===== */
.sidebar{
  position:fixed;left:0;top:var(--hh);width:var(--sw);
  height:calc(100vh - var(--hh));height:calc(100dvh - var(--hh));
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border-right:1.5px solid var(--brd);z-index:90;
  transition:transform .3s cubic-bezier(.4,0,.2,1);padding:8px 0 calc(var(--fh) + 40px)
}
.sidebar.open{z-index:150}
.sb-group{font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);padding:14px 20px 4px}
.sidebar a{
  display:flex;align-items:center;gap:10px;padding:10px 18px;
  color:var(--t2);text-decoration:none;font-size:.865rem;font-weight:500;
  transition:var(--tr);border-left:3px solid transparent;
  border-radius:0 var(--rsm) var(--rsm) 0;margin:1px 8px 1px 0
}
.sidebar a:hover,.sidebar a.active{background:rgba(255,140,0,.1);color:var(--acc);border-left-color:var(--acc)}
.sidebar a .ico{font-size:.95rem;width:20px;text-align:center;flex-shrink:0}
.sidebar a .badge-new{background:var(--acc);color:#fff;font-size:.65rem;padding:2px 6px;border-radius:10px;margin-left:auto}

/* ===== MAIN ===== */
.main{margin-left:var(--sw);padding:22px;min-height:calc(100vh - var(--hh));animation:fadeIn .35s ease;padding-bottom:calc(var(--fh) + 40px)}

/* ===== FOOTER ===== */
.footer{position:fixed;bottom:0;left:0;right:0;height:var(--fh);display:flex;align-items:center;justify-content:center;background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1.5px solid var(--brd);font-size:.78rem;color:var(--t3);z-index:100;gap:6px;padding-bottom:env(safe-area-inset-bottom)}
.footer .brand{background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800}

/* ===== SECTION HEADING ===== */
.sh{margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--brd);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sh h2{font-size:1.5rem;font-weight:900}
.sh .hint{font-size:.78rem;color:var(--t3);margin-left:auto}

/* ===== STAT GRID ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:15px;margin-bottom:22px}
.stat-card{padding:20px 18px;text-align:center;position:relative;overflow:hidden;animation:fadeIn .4s ease}
.stat-card::before{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));opacity:.07}
.stat-card .num{font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:6px}
.stat-card .lbl{font-size:.78rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

/* ===== TABLE ===== */
table{width:100%;border-collapse:separate;border-spacing:0;margin:12px 0}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--brd)}
th{font-size:.74rem;text-transform:uppercase;color:var(--t3);font-weight:700;letter-spacing:.06em;position:sticky;top:0;background:var(--card)}
tr:hover td{background:rgba(255,140,0,.04)}
.tbl-wrap{border-radius:var(--rsm);overflow:hidden;border:1.5px solid var(--brd)}

/* ===== BADGES ===== */
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:.73rem;font-weight:700;line-height:1}
.bc{background:rgba(255,140,0,.12);color:var(--acc)}
.bg2{background:rgba(255,61,0,.12);color:var(--acc2)}
.bst{background:rgba(39,174,96,.12);color:#27ae60}
.bns{background:rgba(243,156,18,.12);color:#f39c12}
.bpt{background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));color:#fff;min-width:28px;text-align:center}
.bgd{background:rgba(52,152,219,.12);color:#3498db}
.blk{background:rgba(231,76,60,.12);color:#e74c3c}
.bok{background:rgba(39,174,96,.12);color:#27ae60}
.bwn{background:rgba(243,156,18,.12);color:#f39c12}

/* ===== CHIPS ===== */
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:600;background:rgba(255,140,0,.1);color:var(--acc);margin:2px}
.chip .x{cursor:pointer;font-weight:800;margin-left:3px;opacity:.5;font-size:.85rem;transition:var(--tr)}
.chip .x:hover{opacity:1;color:#e74c3c}

/* ===== TABS ===== */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:8px 16px;border-radius:20px;font-size:.83rem;font-weight:600;cursor:pointer;transition:var(--tr);background:var(--card);border:1.5px solid var(--brd);color:var(--t2)}
.tab.active{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 4px 14px rgba(255,140,0,.35)}
.tab:hover:not(.active){background:rgba(255,140,0,.08);border-color:var(--acc)}

/* ===== MODAL ===== */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
.modal{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1.5px solid var(--brd);border-radius:var(--radius);padding:28px;max-width:580px;width:100%;max-height:88vh;overflow-y:auto;animation:slideDown .3s cubic-bezier(.4,0,.2,1);box-shadow:0 24px 80px rgba(0,0,0,.28)}
.modal h3{margin-bottom:18px;font-size:1.2rem;font-weight:800}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--brd)}

/* ===== FORM GROUP ===== */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.76rem;font-weight:700;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.fg-row{display:flex;gap:10px;flex-wrap:wrap}
.fg-row .fg{flex:1;min-width:140px;margin-bottom:0}

/* ===== TOAST ===== */
#toasts{position:fixed;top:78px;right:18px;z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 18px;border-radius:12px;font-size:.875rem;font-weight:600;animation:slideInR .3s ease;min-width:250px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.22);pointer-events:all;cursor:pointer}
.toast-success{background:linear-gradient(135deg,#27ae60,#16a085);color:#fff}
.toast-error{background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff}
.toast-warning{background:linear-gradient(135deg,#f39c12,#e67e22);color:#fff}
.toast-info{background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));color:#fff}

/* ===== SEARCH BOX ===== */
.sbox{position:relative;margin-bottom:16px}
.sbox input{padding-left:40px}
.sbox::before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.9rem;z-index:1}

/* ===== LOGIN PAGE ===== */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,rgba(255,140,0,.06),rgba(255,61,0,.04))}
.login-box{max-width:440px;width:100%;padding:44px;animation:slideDown .5s ease;position:relative;overflow:hidden}
.login-box::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));opacity:.07;pointer-events:none}
.login-logo{text-align:center;margin-bottom:20px}
.login-logo-ph{width:72px;height:72px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));display:inline-flex;align-items:center;justify-content:center;font-size:2rem;box-shadow:0 8px 30px rgba(255,140,0,.3)}
.login-box h2{text-align:center;margin-bottom:6px;font-size:1.45rem;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.login-box .sub{text-align:center;color:var(--t3);font-size:.84rem;margin-bottom:28px;font-weight:500}
.ltabs{display:flex;margin-bottom:24px;border-radius:12px;overflow:hidden;border:1.5px solid var(--brd);background:var(--bg)}
.ltab{flex:1;padding:11px;text-align:center;cursor:pointer;font-weight:700;font-size:.875rem;transition:var(--tr);color:var(--t3)}
.ltab.active{background:var(--acc);color:#fff;border-radius:10px}

/* ===== LOCKED OVERLAY ===== */
.locked{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;gap:18px;text-align:center;padding:20px}
.lock-icon{font-size:5rem;animation:float 2s infinite ease-in-out}

/* ===== CONFETTI ===== */
.cft{position:fixed;top:-10px;width:10px;height:10px;border-radius:50%;animation:confettiFall linear forwards;pointer-events:none;z-index:50}

/* ===== RIBBON ===== */
.ribbon{background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));color:#fff;padding:14px 32px;border-radius:14px;text-align:center;font-size:1.15rem;font-weight:800;animation:ribbonWave 3s infinite ease-in-out;margin-bottom:22px;box-shadow:0 8px 30px rgba(255,140,0,.38)}

/* ===== RANK CARD ===== */
.rank-card{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:10px;border-radius:var(--radius);transition:var(--tr)}
.rank-card:hover{transform:translateX(4px)}
.rank-card.top1{background:linear-gradient(135deg,rgba(255,215,0,.18),rgba(255,215,0,.06));border:1.5px solid rgba(255,215,0,.4)}
.rank-card.top2{background:linear-gradient(135deg,rgba(192,192,192,.18),rgba(192,192,192,.06));border:1.5px solid rgba(192,192,192,.4)}
.rank-card.top3{background:linear-gradient(135deg,rgba(205,127,50,.18),rgba(205,127,50,.06));border:1.5px solid rgba(205,127,50,.4)}
.rank-icon{font-size:2rem;animation:float 3s infinite ease-in-out;flex-shrink:0}
.rank-pts{font-size:1.5rem;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-left:auto;flex-shrink:0}

/* ===== PRATHIBA CARD ===== */
.pcard{padding:14px 16px;border-radius:var(--radius);margin-bottom:10px;display:flex;align-items:center;gap:14px;border:1.5px solid var(--brd);background:var(--card);transition:var(--tr)}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--shd)}

/* ===== COMP REG CARD ===== */
.crcard{padding:18px;margin-bottom:14px;border-radius:var(--radius)}
.crhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}

/* ===== SUGGEST LIST ===== */
.sswrap{position:relative;max-width:360px}
.suglist{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1.5px solid var(--brd);border-radius:12px;max-height:230px;overflow-y:auto;z-index:15;box-shadow:var(--shd);display:none}
.suglist.show{display:block}
.sugitem{padding:10px 14px;cursor:pointer;font-size:.85rem;font-weight:500;display:flex;align-items:center;gap:8px;transition:var(--tr);border-bottom:1px solid var(--brd)}
.sugitem:last-child{border-bottom:none}
.sugitem:hover{background:rgba(255,140,0,.1)}
.sugitem.dis{opacity:.45;cursor:not-allowed}
.warn-txt{color:#f39c12;font-size:.7rem;margin-left:auto}

/* ===== INFO BOX ===== */
.infobox{background:rgba(255,140,0,.06);border:1px dashed var(--acc);border-radius:12px;padding:13px 16px;margin-bottom:14px;font-size:.85rem;color:var(--t2);display:flex;align-items:flex-start;gap:10px}
.infobox .ii{font-size:1.15rem;flex-shrink:0;margin-top:1px}

/* ===== SLOT CARD / RESULT ITEM ===== */
.slot-card{border-radius:14px;padding:16px;margin-bottom:12px;border:1.5px solid var(--brd);background:var(--card)}
.slot-card h4{margin-bottom:12px;color:var(--acc);font-weight:800;font-size:1rem}
.ritem{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;margin-bottom:6px;background:rgba(255,140,0,.04);flex-wrap:wrap;transition:var(--tr)}
.ritem:hover{background:rgba(255,140,0,.09)}

/* ===== INLINE FORM ===== */
.iform{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:18px;margin-bottom:16px}
.iform .fg{margin-bottom:0;flex:1;min-width:130px}

/* ===== PREMIUM ===== */
.premium{padding:60px 20px;text-align:center}
.premium h2{font-size:2rem;margin-bottom:10px;background:linear-gradient(135deg,gold,orange);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.contact-box{background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));color:#fff;padding:15px 30px;border-radius:12px;font-size:1.1rem;display:inline-block;margin-top:16px}

/* ===== UTILITIES ===== */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
code{background:rgba(255,140,0,.1);padding:2px 8px;border-radius:6px;font-size:.83rem;font-family:monospace}
.grad{background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.empty{text-align:center;padding:50px 20px;color:var(--t3)}
.empty .ei{font-size:3.5rem;margin-bottom:14px;opacity:.55}
.empty p{font-size:.95rem;font-weight:500}
.divider{height:1px;background:var(--brd);margin:16px 0}
.fw{font-weight:700}
.muted{color:var(--t3)}
.eye-btn{cursor:pointer;font-size:.88rem;background:rgba(255,140,0,.1);border:none;padding:6px 10px;border-radius:8px;color:var(--acc);transition:var(--tr)}
.eye-btn:hover{background:var(--acc);color:#fff;transform:scale(1.1)}
.hamburger{display:none;font-size:1.5rem;background:none;padding:4px 8px;border:none;color:var(--t1)}
.sp{width:18px;height:18px;border:2.5px solid rgba(255,140,0,.2);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
.student-profile{padding:28px;max-width:520px;margin:40px auto;text-align:center}
.chest-big{font-size:3.5rem;font-weight:900;background:linear-gradient(135deg,var(--acc),var(--acc3),var(--acc2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--t3)}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0;padding:14px;padding-bottom:calc(var(--fh) + 40px)}

  .stat-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .iform{flex-direction:column}
  .sswrap{max-width:100%}
  .login-box{padding:28px}
  .two-col,.three-col{grid-template-columns:1fr}
  .sh .hint{display:none}
  .tbl-wrap{overflow-x:auto}
  .header{padding:8px 12px;gap:8px}
  .header .title{font-size:.78rem}
  .header .org{font-size:.62rem}
  .save-badge{display:none}
  .header-right{gap:4px}
  .theme-btn{width:32px;height:32px;font-size:1rem}
  .header-right .btn-ghost{padding:6px 10px;font-size:.72rem}
  .logo-img,.logo-placeholder{width:34px;height:34px}
  .footer{z-index:80}
  .sidebar.open{z-index:150}
}

@media(max-width:400px){
  .header .title{font-size:.7rem}
  .header .org{display:none}
  .header-right .btn-ghost span.lbl{display:none}
}

          for (var i = 0; i < rsBlocks.length; i++) {

      img += '\u0020height="';

      var max = size - margin;

<script>
'use strict';
/* ================================================================
   STATE & PERSISTENCE
   ================================================================ */
const STORAGE_KEY = 'pollappp_v2_state';
const API_URL = 'api.php';
const API_KEY = 'change-me-please'; // must match API_KEY in api.php

/* Auto-detects the domain this app is hosted on, for branding text.
   Falls back to a generic label when opened locally (file://, no hostname). */
function siteDomain() {
  try {
    const h = (location.hostname || '').replace(/^www\./, '');
    return h || 'This App';
  } catch (e) { return 'This App'; }
}

function defaultState() {
  return {
    config:{
      eventName:siteDomain()+' MEELAD PROGRAMME HELPER',
      orgName:'Hidaya Madrasa Chernikode',
      adminPass:'admin123',logo:'',icon:'🕌',
      accentColor:'#ff8c00',maxProgPerCat:0,maxGenProg:0
    },
    categories:[
      {id:'subjunior',name:'Sub Junior',order:1},
      {id:'junior',name:'Junior',order:2},
      {id:'highschool',name:'High School',order:3},
      {id:'hss',name:'Higher Secondary',order:4},
      {id:'general',name:'General',order:5}
    ],
    teams:[],students:[],competitions:[],judges:[],marks:[],
    registrations:[],attendance:[],results:[],
    bonus:[],locked:false,theme:'light',schedule:[]
  };
}

function loadState() {
  try {
    const d = localStorage.getItem(STORAGE_KEY);
    if (d) {
      const p = JSON.parse(d);
      const def = defaultState();
      if (!p.schedule) p.schedule = [];
      if (!p.bonus) p.bonus = [];
      if (!p.attendance) p.attendance = [];
      if (!p.judges) p.judges = [];
      if (!p.marks) p.marks = [];
      if (!p.config) p.config = def.config;
      if (!p.config.accentColor) p.config.accentColor = '#ff8c00';
      if (!p.config.maxProgPerCat) p.config.maxProgPerCat = 0;
      if (!p.config.maxGenProg) p.config.maxGenProg = 0;
      return p;
    }
  } catch(e) { console.error('Load error', e); }
  return defaultState();
}

function saveState() {
  try {
    // Stamp every save with the time it was made, so we can tell local
    // vs. server data apart later and never blindly clobber newer data.
    S.updatedAt = Date.now();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
    // Mark that this device has changes the server hasn't confirmed yet.
    // This flag survives a reload/close, so if the tab is closed before
    // the debounced sync below fires, we know on next load that local
    // data is ahead of the server and must not be overwritten.
    localStorage.setItem(STORAGE_KEY + '_dirty', '1');
    updateSaveBadge(true);
  } catch(e) { toast('Storage full! Try exporting data.','error'); }
  syncToServer();
}

/* ---- Server sync (data/state.json on the domain) ---- */
let syncTimer = null;
let serverSyncFailed = false;
let syncInFlight = null;
function syncToServer(immediate) {
  clearTimeout(syncTimer);
  const doSync = () => {
    const payload = JSON.stringify(S);
    syncInFlight = fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Api-Key': API_KEY },
      body: payload
    }).then(r => {
      if (!r.ok) throw new Error('sync failed');
      serverSyncFailed = false;
      // Only clear the dirty flag if nothing has changed since we
      // started this request (S may have been edited again meanwhile).
      if (JSON.stringify(S) === payload) {
        localStorage.removeItem(STORAGE_KEY + '_dirty');
      }
      updateSyncBadge(true);
    }).catch(() => {
      if (!serverSyncFailed) { serverSyncFailed = true; toast('Server sync unavailable — saved locally only','warning'); }
      updateSyncBadge(false);
    }).finally(() => { syncInFlight = null; });
  };
  if (immediate) { doSync(); return; }
  syncTimer = setTimeout(doSync, 600); // debounce rapid edits
}

// Flush any pending/unsynced changes before the page is closed or reloaded,
// so a quick refresh right after adding data can't race the debounce timer
// and lose those edits.
window.addEventListener('beforeunload', () => {
  if (localStorage.getItem(STORAGE_KEY + '_dirty')) {
    clearTimeout(syncTimer);
    try {
      navigator.sendBeacon(API_URL, new Blob([JSON.stringify(S)], {type:'application/json'}));
    } catch(e) {}
  }
});

function hydrateFromServer() {
  fetch(API_URL, { headers: { 'X-Api-Key': API_KEY } })
    .then(r => r.ok ? r.json() : null)
    .then(serverData => {
      if (!serverData || !serverData.config) return;

      // Never let a stale/older server copy stomp on local data that
      // hasn't been confirmed saved to the server yet (e.g. the tab was
      // closed/reloaded before the debounced sync fired, or another
      // save is still in flight). In that case, push local up instead
      // of pulling server data down.
      const localDirty = !!localStorage.getItem(STORAGE_KEY + '_dirty');
      const localNewer = S && S.updatedAt && serverData.updatedAt && S.updatedAt > serverData.updatedAt;
      if (localDirty || localNewer || syncInFlight) {
        syncToServer(true); // reconcile: make the server match our newer local copy
        return;
      }

      if (!serverData.schedule) serverData.schedule = [];
      if (!serverData.bonus) serverData.bonus = [];
      if (!serverData.attendance) serverData.attendance = [];
      if (!serverData.marks) serverData.marks = [];
      S = serverData;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
      render();
    })
    .catch(() => { /* offline — keep using localStorage copy */ });
}

function updateSyncBadge(ok) {
  const el = document.getElementById('saveBadge');
  if (!el) return;
  el.textContent = ok ? '☁️ Synced' : '⚠️ Local only';
  el.style.background = ok ? 'rgba(39,174,96,.12)' : 'rgba(231,76,60,.12)';
  el.style.color = ok ? '#27ae60' : '#e74c3c';
}

let S = loadState();
let CU = null; // current user
let TAB = 'dashboard';
let RCOMP = ''; // selected result comp

/* ================================================================
   UTILS
   ================================================================ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2,7); }

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ================================================================
   SAVE BADGE
   ================================================================ */
let saveBadgeTimer = null;
function updateSaveBadge(saved) {
  const el = document.getElementById('saveBadge');
  if (!el) return;
  el.textContent = saved ? '✅ Saved' : '💾 Saving...';
  el.style.background = saved ? 'rgba(39,174,96,.12)' : 'rgba(243,156,18,.12)';
  el.style.color = saved ? '#27ae60' : '#f39c12';
  clearTimeout(saveBadgeTimer);
  if (saved) saveBadgeTimer = setTimeout(() => { if(el) el.textContent = '💾 Auto-save ON'; }, 2000);
}

/* ================================================================
   TOAST
   ================================================================ */
function toast(msg, type='info') {
  const c = document.getElementById('toasts');
  if (!c) return;
  const icons = {success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
  const t = document.createElement('div');
  t.className = 'toast toast-'+type;
  t.innerHTML = icons[type]+' <span>'+msg+'</span>';
  t.onclick = () => t.remove();
  c.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(110%)'; t.style.transition='all .3s'; setTimeout(()=>t.remove(),300); }, 3500);
}

/* ================================================================
   QR CODE (SVG) — real, scannable QR codes via qrcode-generator lib
   ================================================================ */
const _qrCache = {};
function qrSVG(text, size) {
  size = size || 100;
  if (_qrCache[text]) return _qrCache[text].replace(/W_H_PLACEHOLDER/g, size);
  try {
    const qr = qrcode(0, 'M'); // typeNumber 0 = auto-detect smallest size, 'M' = ~15% error correction
    qr.addData(text);
    qr.make();
    const count = qr.getModuleCount();
    const margin = 2; // quiet zone (modules)
    const dim = count + margin * 2;
    let path = '';
    for (let r = 0; r < count; r++) {
      for (let c = 0; c < count; c++) {
        if (qr.isDark(r, c)) path += 'M'+(c+margin)+','+(r+margin)+'h1v1h-1z ';
      }
    }
    const sv = '<svg xmlns="http://www.w3.org/2000/svg" width="W_H_PLACEHOLDER" height="W_H_PLACEHOLDER" viewBox="0 0 '+dim+' '+dim+'" shape-rendering="crispEdges">'+
      '<rect width="'+dim+'" height="'+dim+'" fill="white"/>'+
      '<path d="'+path+'" fill="black"/>'+
      '</svg>';
    _qrCache[text] = sv;
    return sv.replace(/W_H_PLACEHOLDER/g, size);
  } catch (e) {
    return '<svg xmlns="http://www.w3.org/2000/svg" width="'+size+'" height="'+size+'"><rect width="100%" height="100%" fill="#f5f5f5" stroke="#ccc"/><text x="50%" y="50%" font-size="7" text-anchor="middle" fill="#c00">QR error</text></svg>';
  }
}

   DATA HELPERS
   ================================================================ */
const gT = id => S.teams.find(t=>t.id===id);
const gJ = id => S.judges.find(j=>j.id===id);
const jComps = j => (!j.compIds||!j.compIds.length)?S.competitions:S.competitions.filter(c=>j.compIds.includes(c.id));
const gS = id => S.students.find(s=>s.id===id);
const gC = id => S.competitions.find(c=>c.id===id);
const gCat = id => S.categories.find(c=>c.id===id);
const gCatN = id => { const c=gCat(id); return c?c.name:id; };
const tmSts = tid => S.students.filter(s=>s.teamId===tid);
const tmStsByCat = (tid,cat) => S.students.filter(s=>s.teamId===tid&&s.category===cat);
const compRegs = cid => S.registrations.filter(r=>r.compId===cid);
const tmCompRegs = (tid,cid) => S.registrations.filter(r=>r.compId===cid&&(gS(r.studentId)||{}).teamId===tid);
const stRegs = sid => S.registrations.filter(r=>r.studentId===sid);
const stRes = sid => S.results.filter(r=>r.studentId===sid);
const compRes = cid => S.results.filter(r=>r.compId===cid);
const compJudges = cid => S.judges.filter(j=>(!j.compIds||!j.compIds.length)||j.compIds.includes(cid));
const compMax = c => (c&&(parseFloat(c.maxMarks)||0)>0?parseFloat(c.maxMarks):100);
const perJudgeMax = c => { const n=compJudges(c.id).length; return n?compMax(c)/n:compMax(c); };
const pjDisp = v => String(Math.round(v*100)/100);
const markVal = (cid,sid,jid) => { const m=(S.marks||[]).find(x=>x.compId===cid&&x.studentId===sid&&x.judgeId===jid); return m?m.points:''; };
const totalFor = (cid,sid) => { let t=0,has=false; (S.marks||[]).forEach(m=>{ if(m.compId===cid&&m.studentId===sid){ t+=parseFloat(m.points)||0; has=true; } }); return has?Math.round(t*100)/100:null; };
const marksBySid = (cid,sid) => (S.marks||[]).filter(m=>m.compId===cid&&m.studentId===sid);
function rankComp(cid) {
  const list=S.results.filter(r=>r.compId===cid&&r.points!==''&&r.points!=null);
  list.sort((a,b)=>(parseFloat(b.points)||0)-(parseFloat(a.points)||0));
  list.forEach((r,i)=>{ r.position=(i>0&&parseFloat(r.points)===parseFloat(list[i-1].points))?list[i-1].position:(i+1); });
}
const stCntByCat = cid => S.students.filter(s=>s.category===cid).length;
const compCntByCat = cid => S.competitions.filter(c=>c.category===cid).length;

function stProgInCat(sid,catId) {
  return S.registrations.filter(r=>{if(r.studentId!==sid)return false;const c=gC(r.compId);return c&&c.category===catId;}).length;
}
function stGenProg(sid) {
  return S.registrations.filter(r=>{if(r.studentId!==sid)return false;const c=gC(r.compId);return c&&c.category==='general';}).length;
}

/* ================================================================
   POINTS
   ================================================================ */
function stPts(sid) {
  let p=0;
  S.results.forEach(r=>{if(r.studentId!==sid)return;const c=gC(r.compId);if(!c||c.isGroup||c.category==='general')return;p+=(r.points||0);});
  return p;
}
function stStagePts(sid) {
  let p=0;
  S.results.forEach(r=>{if(r.studentId!==sid)return;const c=gC(r.compId);if(!c||c.isGroup||c.category==='general')return;if(c.type==='stage')p+=(r.points||0);});
  return p;
}
function stNonStagePts(sid) {
  let p=0;
  S.results.forEach(r=>{if(r.studentId!==sid)return;const c=gC(r.compId);if(!c||c.isGroup||c.category==='general')return;if(c.type==='nonstage')p+=(r.points||0);});
  return p;
}
function tmPts(tid) {
  let p=0;
  S.results.forEach(r=>{const st=gS(r.studentId);if(!st||st.teamId!==tid)return;p+=(r.points||0);});
  S.bonus.forEach(b=>{if(b.teamId===tid)p+=b.points;});
  return p;
}
function tmCatPts(tid,catId) {
  let p=0;
  S.results.forEach(r=>{
    const st=gS(r.studentId);if(!st||st.teamId!==tid)return;
    const c=gC(r.compId);if(!c)return;
    if(c.category===catId||(c.category==='general'&&st.category===catId))p+=(r.points||0);
  });
  return p;
}

window.delTeam = function(id) {
  if(!confirm('Delete this team and ALL its students, registrations, results?'))return;
  const sids=tmSts(id).map(s=>s.id);
  S.students=S.students.filter(s=>s.teamId!==id);
  S.registrations=S.registrations.filter(r=>!sids.includes(r.studentId));
  S.attendance=S.attendance.filter(a=>!sids.includes(a.studentId));
  S.results=S.results.filter(r=>!sids.includes(r.studentId));
  S.marks=(S.marks||[]).filter(m=>!sids.includes(m.studentId));
  S.bonus=S.bonus.filter(b=>b.teamId!==id);
  S.teams=S.teams.filter(t=>t.id!==id);
  saveState();renderMain();toast('Team deleted','success');
};

window.delJudge = function(id) {
  if(!confirm('Delete this judge login?'))return;
  const affected={};
  (S.marks||[]).forEach(m=>{ if(m.judgeId===id)affected[m.compId+'|'+m.studentId]=1; });
  S.marks=(S.marks||[]).filter(m=>m.judgeId!==id);
  Object.keys(affected).forEach(k=>{
    const p=k.split('|'),cid=p[0],sid=p[1];
    const t=totalFor(cid,sid);
    const ix=S.results.findIndex(r=>r.compId===cid&&r.studentId===sid);
    if(t==null){ if(ix>-1)S.results.splice(ix,1); }
    else if(ix>-1){ S.results[ix].points=t; }
    rankComp(cid);
  });
  S.judges=S.judges.filter(j=>j.id!==id);
  saveState();renderMain();toast('Judge deleted','success');
};

window.updTot = function(cid) {
  const comp=gC(cid);if(!comp)return;
  const max=compMax(comp);
  let cols=compJudges(cid);
  if(!cols.length)cols=[{id:'__admin__'}];
  compRegs(cid).forEach(r=>{
    const st=gS(r.studentId);if(!st)return;
    let t=0,has=false;
    cols.forEach(j=>{
      const el=document.getElementById('mk_'+st.id+'_'+j.id);
      if(el&&(el.value||'').trim()!==''){t+=parseFloat(el.value)||0;has=true;}
    });
    const cell=document.getElementById('tot_'+st.id);
    if(cell)cell.textContent=has?((Math.round(t*100)/100)+' / '+pjDisp(max)):'-';
  });
};

window.saveAllRes = function(cid) {
  const comp=gC(cid);if(!comp)return;
  let cols=compJudges(cid);
  if(!cols.length)cols=[{id:'__admin__',name:'Marks'}];
  const max=compMax(comp),pjm=perJudgeMax(comp);
  const regs=compRegs(cid);
  const regSts=regs.map(r=>gS(r.studentId)).filter(Boolean);
  const isJudge=CU?.type==='judge';
  for(const s of regSts){
    for(const j of cols){
      if(isJudge&&j.id!==CU.judgeId)continue;
      const el=document.getElementById('mk_'+s.id+'_'+j.id);
      if(!el)continue;
      const v=(el.value||'').trim();
      if(v!==''){
        const n=parseFloat(v);
        if(isNaN(n)||n<0||n>pjm){toast(j.name+': marks for '+s.name+' must be between 0 and '+pjDisp(pjm),'error');return;}
      }
    }
  }
  regSts.forEach(s=>{
    let removedAny=false;
    cols.forEach(j=>{
      if(isJudge&&j.id!==CU.judgeId)return;
      const el=document.getElementById('mk_'+s.id+'_'+j.id);
      if(!el)return;
      const v=(el.value||'').trim();
      const ix=(S.marks||[]).findIndex(m=>m.compId===cid&&m.studentId===s.id&&m.judgeId===j.id);
      if(v===''){if(ix>-1){S.marks.splice(ix,1);removedAny=true;}return;}
      const pts=Math.round((parseFloat(v)||0)*100)/100;
      if(ix>-1){S.marks[ix].points=pts;S.marks[ix].judgeName=j.name;}
      else S.marks.push({id:uid(),compId:cid,studentId:s.id,judgeId:j.id,judgeName:j.name,points:pts});
    });
    const all=marksBySid(cid,s.id);
    const grdEl=document.getElementById('grd_'+s.id);
    const grade=grdEl?(grdEl.value||'').trim():'';
    if(!all.length){
      const ri=S.results.findIndex(r=>r.compId===cid&&r.studentId===s.id);
      // Keep legacy totals (saved before per-judge marks existed) unless a mark was just cleared.
      if(ri>-1&&removedAny)S.results.splice(ri,1);
      return;
    }
    const tot=Math.round(all.reduce((a,m)=>a+(parseFloat(m.points)||0),0)*100)/100;
    const names=[...new Set(all.map(m=>m.judgeName||((gJ(m.judgeId)||{}).name||'')))].filter(Boolean).join(', ');
    let r=S.results.find(x=>x.compId===cid&&x.studentId===s.id);
    if(!r){r={id:uid(),compId:cid,studentId:s.id};S.results.push(r);}
    r.points=tot;r.grade=grade;r.judge=names;
  });
  if(!S.results.some(r=>r.compId===cid)){toast('Enter marks for at least one participant','error');return;}
  rankComp(cid);
  saveState();toast('Marks saved — totals out of '+pjDisp(max)+', positions auto-ranked 🏅','success');renderMain();
};

function buildPrathiba(flt) {
  const catList=flt==='overall'?S.categories.filter(c=>c.id!=='general'):[gCat(flt)].filter(Boolean).filter(c=>c.id!=='general');
  let h='';
  catList.forEach(cat=>{
    const sts=S.students.filter(s=>s.category===cat.id);
    let topS=null,topN=null,mxS=0,mxN=0;
    sts.forEach(s=>{
      const sp=stStagePts(s.id),np=stNonStagePts(s.id);
      if(sp>mxS){mxS=sp;topS=s;}
      if(np>mxN){mxN=np;topN=s;}
    });
    h+='<div style="margin-bottom:8px;font-weight:800;color:var(--t2);font-size:1rem">'+esc(cat.name)+'</div>';
    if(topS&&mxS>0){const tm=gT(topS.teamId);h+='<div class="pcard">🎭<div style="margin-left:8px"><strong>Sargha Prathiba</strong><br>'+esc(topS.name)+' <span class="badge bpt">'+esc(topS.chest)+'</span> '+(tm?esc(tm.name):'')+' — <strong class="grad">'+mxS+' pts</strong></div></div>';}
    if(topN&&mxN>0){const tm=gT(topN.teamId);h+='<div class="pcard">📝<div style="margin-left:8px"><strong>Kala Prathiba</strong><br>'+esc(topN.name)+' <span class="badge bpt">'+esc(topN.chest)+'</span> '+(tm?esc(tm.name):'')+' — <strong class="grad">'+mxN+' pts</strong></div></div>';}
  });
  return h||'<p style="color:var(--t3)">No results yet</p>';
}

function buildTopSec(catId) {
  const sts=S.students.filter(s=>s.category===catId);
  const overall=sts.map(s=>({...s,pts:stPts(s.id)})).sort((a,b)=>b.pts-a.pts).slice(0,15);
  const stage=sts.map(s=>({...s,pts:stStagePts(s.id)})).sort((a,b)=>b.pts-a.pts).slice(0,15);
  const nonstage=sts.map(s=>({...s,pts:stNonStagePts(s.id)})).sort((a,b)=>b.pts-a.pts).slice(0,15);
  function rl(title,ico,list){
    return '<div class="glass" style="padding:20px;margin-bottom:16px"><h3 style="margin-bottom:12px">'+ico+' '+title+'</h3>'+
      (list.filter(s=>s.pts>0).map((s,i)=>{
        const tm=gT(s.teamId);
        const ri=i<3?['🥇','🥈','🥉'][i]:'#'+(i+1);
        return '<div class="rank-card" style="padding:10px">'+
          '<span style="font-size:1.2rem">'+ri+'</span><strong>'+esc(s.name)+'</strong>'+
          '<span class="badge bpt">'+esc(s.chest)+'</span>'+
          '<span style="color:var(--t3)">'+(tm?esc(tm.name):'')+'</span>'+
          '<span class="badge bpt" style="margin-left:auto">'+s.pts+'</span>'+
        '</div>';
      }).join('')||'<p style="color:var(--t3);padding:12px">No results yet</p>')+
    '</div>';
  }
  return rl('Overall Top 15','🏆',overall)+rl('Stage (Sargha Prathiba)','🎭',stage)+rl('Non-Stage (Kala Prathiba)','📝',nonstage);
}

window.exportData = function() {
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='pollappp_backup_'+new Date().toISOString().split('T')[0]+'.json';a.click();
  toast('Backup exported! 📥','success');
};

window.importData = function() {
  const file=document.getElementById('importFile')?.files[0];
  if(!file){toast('Please select a file','error');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.config){toast('Invalid backup file','error');return;}
      if(!confirm('This will REPLACE ALL existing data. Are you sure?'))return;
      if(!data.schedule)data.schedule=[];
      if(!data.bonus)data.bonus=[];
      if(!data.marks)data.marks=[];
      S=data;saveState();CU=null;render();
      toast('Data imported successfully! 💾','success');
    }catch(err){toast('Invalid JSON file','error');}
  };
  reader.readAsText(file);
};

window.clearStorage = function() {
  if(!confirm('⚠️ DELETE ALL DATA? This cannot be undone!'))return;
  if(!confirm('Are you ABSOLUTELY SURE?'))return;
  S=defaultState();saveState();CU=null;render();
  toast('All data cleared','warning');
};

function tStudents(mc,team) {
  let flt='all',q='';

  function draw() {
    const cats=[{id:'all',name:'All'},...nonGen];
    let list=tmSts(team.id).filter(s=>s.category!=='general');
    if(flt!=='all')list=list.filter(s=>s.category===flt);
    if(q){const qq=q.toLowerCase();list=list.filter(s=>s.name.toLowerCase().includes(qq)||s.chest.toLowerCase().includes(qq));}
    mc.innerHTML=
      '<div class="sh"><h2>👨‍🎓 Students</h2></div>'+
      '<div class="infobox"><span class="ii">ℹ️</span><div><strong>General</strong> category contains all your students automatically. Add students to their non-general category here.</div></div>'+
      '<button class="btn-primary" onclick="openAddSt(\''+team.id+'\')" style="margin-bottom:16px">+ Add Student</button> '+
      '<button class="btn-secondary" id="btnCardsTeam" style="margin-bottom:16px">🪪 Print Chest Cards ('+list.length+')</button>'+
      '<div class="tabs">'+cats.map(c=>'<div class="tab'+(flt===c.id?' active':'')+'" data-stf="'+c.id+'">'+esc(c.name)+' ('+(c.id==='all'?tmSts(team.id).filter(s=>s.category!=='general').length:tmStsByCat(team.id,c.id).length)+')</div>').join('')+'</div>'+
      '<div class="sbox"><input placeholder="Search by name or chest number..." value="'+esc(q)+'" id="stq"></div>'+
      '<div class="tbl-wrap glass"><table>'+
        '<thead><tr><th>Chest No</th><th>Name</th><th>Category</th><th>Competitions</th><th>Points</th><th>Actions</th></tr></thead>'+
        '<tbody>'+
          list.map(s=>{
            const comps=stRegs(s.id).map(r=>{const c=gC(r.compId);return c?'<span class="chip">'+esc(c.name)+'</span>':'';}).join('');
            return '<tr>'+
              '<td><span class="badge bpt">'+esc(s.chest)+'</span></td>'+
              '<td><strong>'+esc(s.name)+'</strong></td>'+
              '<td><span class="badge bc">'+gCatN(s.category)+'</span></td>'+
              '<td>'+(comps||'<span style="color:var(--t3)">—</span>')+'</td>'+
              '<td><span class="badge bpt">'+stPts(s.id)+'</span></td>'+
              '<td style="white-space:nowrap">'+
                '<button class="eye-btn" onclick="printChestCard(\''+s.id+'\')" title="Print Chest Card">🪪</button> '+
                '<button class="eye-btn" onclick="openEditSt(\''+s.id+'\',\''+team.id+'\')">✏️</button> '+
                '<button class="btn-danger" onclick="delSt(\''+s.id+'\',\''+team.id+'\')" style="font-size:.8rem;padding:5px 10px">🗑️</button>'+
              '</td>'+
            '</tr>';
          }).join('')+
          (list.length?'':`<tr><td colspan="6" style="text-align:center;color:var(--t3);padding:30px">No students. Click "+ Add Student" to get started.</td></tr>`)+
        '</tbody></table></div>';
    mc.querySelectorAll('[data-stf]').forEach(t=>{t.onclick=()=>{flt=t.dataset.stf;draw();};});
    document.getElementById('stq').oninput=function(){q=this.value;draw();};
    document.getElementById('btnCardsTeam').onclick=()=>printChestCardsBulk(list.map(s=>s.id),team.name+' — Chest Cards');
  }
  draw();
}

window.openAddSt = function(tid) {
  const nonGen=S.categories.filter(c=>c.id!=='general');
  showModal('Add Student',
    '<div class="fg"><label>Chest Number</label><input id="mSC" placeholder="e.g. 101"></div>'+
    '<div class="fg"><label>Student Name</label><input id="mSN" placeholder="Full name"></div>'+
    '<div class="fg"><label>Category</label><select id="mSCat">'+nonGen.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div>'+
    '<div class="infobox" style="margin-top:8px"><span class="ii">ℹ️</span>Students are automatically included in General category competitions.</div>',
  function(){
    const chest=document.getElementById('mSC').value.trim();
    const name=document.getElementById('mSN').value.trim();
    const cat=document.getElementById('mSCat').value;
    if(!chest||!name){toast('Fill chest number and name','error');return false;}
    if(S.students.find(s=>s.teamId===tid&&s.chest===chest)){toast('Duplicate chest number!','error');return false;}
    S.students.push({id:uid(),chest,name,category:cat,teamId:tid});
    saveState();renderMain();toast(name+' added! 💾','success');
  });
};

window.openEditSt = function(sid,tid) {
  const s=gS(sid);if(!s)return;
  const nonGen=S.categories.filter(c=>c.id!=='general');
  showModal('Edit Student',
    '<div class="fg"><label>Chest Number</label><input id="mSC" value="'+esc(s.chest)+'"></div>'+
    '<div class="fg"><label>Student Name</label><input id="mSN" value="'+esc(s.name)+'"></div>'+
    '<div class="fg"><label>Category</label><select id="mSCat">'+nonGen.map(c=>'<option value="'+c.id+'"'+(s.category===c.id?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div>',
  function(){
    const chest=document.getElementById('mSC').value.trim();
    const name=document.getElementById('mSN').value.trim();
    const cat=document.getElementById('mSCat').value;
    if(!chest||!name){toast('Fill all fields','error');return false;}
    if(S.students.find(x=>x.teamId===tid&&x.chest===chest&&x.id!==sid)){toast('Duplicate chest number!','error');return false;}
    const oldCat=s.category;
    Object.assign(s,{chest,name,category:cat});
    if(oldCat!==cat){S.registrations=S.registrations.filter(r=>{if(r.studentId!==sid)return true;const comp=gC(r.compId);return comp&&(comp.category===cat||comp.category==='general');});}
    saveState();renderMain();toast('Student updated 💾','success');
  });
};

window.delSt = function(sid,tid) {
  if(!confirm('Delete this student and all their data?'))return;
  S.students=S.students.filter(x=>x.id!==sid);
  S.registrations=S.registrations.filter(r=>r.studentId!==sid);
  S.attendance=S.attendance.filter(a=>a.studentId!==sid);
  S.results=S.results.filter(r=>r.studentId!==sid);
  S.marks=(S.marks||[]).filter(m=>m.studentId!==sid);
  saveState();renderMain();toast('Student deleted','success');
};

/* ================================================================
   TEAM: REGISTER FOR COMPETITIONS
   ================================================================ */
function tRegister(mc,team) {
  const mySts=tmSts(team.id);
  const stCats=[...new Set(mySts.map(s=>s.category))].filter(c=>c!=='general');
  const availIds=[...stCats];
  if(S.categories.find(c=>c.id==='general'))availIds.push('general');
  const avail=S.categories.filter(c=>availIds.includes(c.id));
  let catFlt=avail[0]?.id||'';

  function draw() {
    const comps=S.competitions.filter(c=>c.category===catFlt);
    mc.innerHTML=
      '<div class="sh"><h2>📝 Register for Competitions</h2></div>'+
      '<div class="infobox"><span class="ii">ℹ️</span><div>For <strong>General</strong> competitions, all your students are eligible.<br>Use the search box to find and add students by chest no or name.</div></div>'+
      '<div class="tabs">'+avail.map(c=>'<div class="tab'+(catFlt===c.id?' active':'')+'" data-rf="'+c.id+'">'+(c.id==='general'?'🌐 ':'')+esc(c.name)+'</div>').join('')+'</div>'+
      '<div id="rcList">'+
        (comps.length?'':'<div class="empty glass"><div class="ei">📝</div><p>No competitions in this category</p></div>')+
        comps.map(comp=>{
          const myRegs=tmCompRegs(team.id,comp.id);
          const rem=comp.maxPerTeam-myRegs.length;
          const chips=myRegs.map(r=>{const st=gS(r.studentId);if(!st)return'';return'<span class="chip">'+esc(st.chest)+' — '+esc(st.name)+' <span class="x" onclick="removeReg(\''+r.id+'\',\''+team.id+'\')">×</span></span>';}).join('');
          return '<div class="crcard glass">'+
            '<div class="crhead">'+
              '<strong>'+esc(comp.name)+'</strong>'+
              (comp.isGroup?'<span class="badge bg2">Group('+comp.groupSize+')</span>':'<span class="badge bc">Individual</span>')+
              '<span class="badge '+(comp.type==='stage'?'bst':'bns')+'">'+(comp.type==='stage'?'🎭 Stage':'📝 Non-Stage')+'</span>'+
              '<button class="eye-btn" onclick="viewCompParts(\''+comp.id+'\')" title="View all participants">👁️</button>'+
              '<span style="margin-left:auto;font-size:.82rem;color:var(--t3)">Max: '+comp.maxPerTeam+' | Used: '+myRegs.length+' | Left: '+rem+'</span>'+
            '</div>'+
            '<div style="margin-bottom:12px">'+(chips||'<span style="color:var(--t3);font-size:.84rem">No students registered yet</span>')+'</div>'+
            (rem>0?
              '<div class="sswrap" id="sw_'+comp.id+'">'+
                '<input placeholder="🔍 Search by chest no or name to add..." id="rsi_'+comp.id+'" autocomplete="off" onfocus="showSugs(\''+comp.id+'\',\''+team.id+'\')" oninput="showSugs(\''+comp.id+'\',\''+team.id+'\')">'+
                '<div class="suglist" id="rsl_'+comp.id+'"></div>'+
              '</div>'+
              '<button class="btn-ghost" style="margin-top:8px;font-size:.8rem" onclick="openAddStForComp(\''+comp.id+'\',\''+team.id+'\')">➕ New Student</button>'
            :'<div style="color:var(--t3);font-size:.84rem;margin-top:4px">✅ All slots filled for your team</div>')+
          '</div>';
        }).join('')+
      '</div>';
    mc.querySelectorAll('[data-rf]').forEach(t=>{t.onclick=()=>{catFlt=t.dataset.rf;draw();};});
    document.addEventListener('click',function(e){if(!e.target.closest('.sswrap'))document.querySelectorAll('.suglist').forEach(sl=>sl.classList.remove('show'));});
  }
  draw();
}

window.showSugs = function(compId,teamId) {
  const comp=gC(compId);if(!comp)return;
  const inp=document.getElementById('rsi_'+compId);
  const sl=document.getElementById('rsl_'+compId);
  if(!inp||!sl)return;
  const q=inp.value.toLowerCase().trim();
  const mySts=tmSts(teamId);
  const myRegs=tmCompRegs(teamId,compId);
  const regIds=myRegs.map(r=>r.studentId);
  let elig=comp.category==='general'?mySts:mySts.filter(s=>s.category===comp.category);
  elig=elig.filter(s=>!regIds.includes(s.id));
  if(q)elig=elig.filter(s=>s.name.toLowerCase().includes(q)||s.chest.toLowerCase().includes(q));
  if(!elig.length){sl.innerHTML='<div class="sugitem dis" style="color:var(--t3)">No eligible students found</div><div class="sugitem" onclick="openAddStForComp(\''+compId+'\',\''+teamId+'\')">➕ Add New Student</div>';sl.classList.add('show');return;}
  sl.innerHTML=elig.slice(0,12).map(s=>{
    let warn='',dis=false;
    if(S.config.maxProgPerCat>0&&comp.category!=='general'){const cnt=stProgInCat(s.id,comp.category);if(cnt>=S.config.maxProgPerCat){warn='⚠️ Category limit';dis=true;}}
    if(S.config.maxGenProg>0&&comp.category==='general'){const cnt=stGenProg(s.id);if(cnt>=S.config.maxGenProg){warn='⚠️ General limit';dis=true;}}
    return '<div class="sugitem'+(dis?' dis':'')+'" onclick="'+(dis?'':' addReg(\''+compId+'\',\''+s.id+'\',\''+teamId+'\')')+'">'+
      '<span class="badge bpt" style="font-size:.7rem">'+esc(s.chest)+'</span>'+
      '<strong>'+esc(s.name)+'</strong>'+
      '<span class="badge bc" style="font-size:.68rem">'+gCatN(s.category)+'</span>'+
      (warn?'<span class="warn-txt">'+warn+'</span>':'')+
    '</div>';
  }).join('');
  sl.classList.add('show');
};

window.addReg = function(compId,studentId,teamId) {
  const comp=gC(compId),st=gS(studentId);
  if(!comp||!st)return;
  if(S.config.maxProgPerCat>0&&comp.category!=='general'){if(stProgInCat(studentId,comp.category)>=S.config.maxProgPerCat){toast(st.name+': category limit reached','warning');return;}}
  if(S.config.maxGenProg>0&&comp.category==='general'){if(stGenProg(studentId)>=S.config.maxGenProg){toast(st.name+': general limit reached','warning');return;}}
  const tr=tmCompRegs(teamId,compId);
  if(tr.length>=comp.maxPerTeam){toast('Max participants per team reached','error');return;}
  if(tr.some(r=>r.studentId===studentId)){toast('Student already registered','warning');return;}
  S.registrations.push({id:uid(),compId,studentId});
  saveState();toast(st.name+' registered! 💾','success');renderMain();
};

window.removeReg = function(regId,teamId) {
  S.registrations=S.registrations.filter(r=>r.id!==regId);
  saveState();toast('Registration removed','success');renderMain();
};

window.openAddStForComp = function(compId,teamId) {
  const comp=gC(compId);if(!comp)return;
  const nonGen=S.categories.filter(c=>c.id!=='general');
  const isGeneral=comp.category==='general';
  showModal('Add New Student',
    '<div class="fg"><label>Chest Number</label><input id="mSC" placeholder="e.g. 101"></div>'+
    '<div class="fg"><label>Student Name</label><input id="mSN" placeholder="Full name"></div>'+
    (isGeneral
      ?'<div class="fg"><label>Category</label><select id="mSCat">'+nonGen.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></div>'
      :'<div class="fg"><label>Category</label><input disabled value="'+esc(gCatN(comp.category))+'"></div>')+
    '<div class="infobox" style="margin-top:8px"><span class="ii">ℹ️</span>Adds this student to your team and registers them for <strong>'+esc(comp.name)+'</strong> right away.</div>',
  function(){
    const chest=document.getElementById('mSC').value.trim();
    const name=document.getElementById('mSN').value.trim();
    const cat=isGeneral?document.getElementById('mSCat').value:comp.category;
    if(!chest||!name){toast('Fill chest number and name','error');return false;}
    if(S.students.find(s=>s.teamId===teamId&&s.chest===chest)){toast('Duplicate chest number!','error');return false;}
    const tr=tmCompRegs(teamId,compId);
    if(tr.length>=comp.maxPerTeam){toast('Max participants per team reached','error');return false;}
    const sid=uid();
    S.students.push({id:sid,chest,name,category:cat,teamId});
    S.registrations.push({id:uid(),compId,studentId:sid});
    saveState();renderMain();toast(name+' added & registered! 💾','success');
  }, '✅ Add & Register');
};

/* ================================================================
   TEAM: MY COMPETITIONS
   ================================================================ */
function tMyComps(mc,team) {
  const sts=tmSts(team.id),sids=sts.map(s=>s.id);
  const myCompIds=[...new Set(S.registrations.filter(r=>sids.includes(r.studentId)).map(r=>r.compId))];
  mc.innerHTML=
    '<div class="sh"><h2>🏆 My Competitions ('+myCompIds.length+')</h2></div>'+
    (myCompIds.length?'':'<div class="empty glass"><div class="ei">🏆</div><p>No registrations yet. Go to "Register for Competitions" to sign up.</p></div>')+
    '<div class="stat-grid">'+
      myCompIds.map(cid=>{
        const c=gC(cid);if(!c)return'';
        const regs=S.registrations.filter(r=>r.compId===cid&&sids.includes(r.studentId));
        return '<div class="glass" style="padding:18px">'+
          '<div style="font-weight:800;margin-bottom:10px">'+esc(c.name)+'</div>'+
          '<div style="margin-bottom:10px">'+
            '<span class="badge bc">'+gCatN(c.category)+'</span> '+
            (c.isGroup?'<span class="badge bg2">Group</span> ':'')+
            '<span class="badge '+(c.type==='stage'?'bst':'bns')+'">'+(c.type==='stage'?'Stage':'Non-Stage')+'</span>'+
          '</div>'+
          '<div>'+regs.map(r=>{const st=gS(r.studentId);return st?'<span class="chip">'+esc(st.chest)+' '+esc(st.name)+'</span>':'';}).join('')+'</div>'+
        '</div>';
      }).join('')+
    '</div>';
}

/* ================================================================
   TEAM: PARTICIPATION LIST
   ================================================================ */
function tPartList(mc,team) {
  const sts=tmSts(team.id);
  mc.innerHTML=
    '<div class="sh"><h2>📋 Participation List</h2></div>'+
    '<button class="btn-primary" onclick="dlPartPDF(\''+team.id+'\')" style="margin-bottom:14px">📄 Download PDF</button>'+
    '<div class="tbl-wrap glass"><table>'+
      '<thead><tr><th>Chest</th><th>Name</th><th>Category</th><th>Competitions</th></tr></thead>'+
      '<tbody>'+
        sts.map(s=>{
          const comps=stRegs(s.id).map(r=>{const c=gC(r.compId);return c?'<span class="chip">'+esc(c.name)+'</span>':'';}).join('');
          return '<tr>'+
            '<td><span class="badge bpt">'+esc(s.chest)+'</span></td>'+
            '<td><strong>'+esc(s.name)+'</strong></td>'+
            '<td><span class="badge bc">'+gCatN(s.category)+'</span></td>'+
            '<td>'+(comps||'<span style="color:var(--t3)">—</span>')+'</td>'+
          '</tr>';
        }).join('')+
        (sts.length?'':`<tr><td colspan="4" style="text-align:center;color:var(--t3);padding:30px">No students yet</td></tr>`)+
      '</tbody></table></div>';
}

window.dlPartPDF = function(tid) {
  const t=gT(tid),sts=tmSts(tid);
  let ct='<table><tr><th>#</th><th>Chest</th><th>Name</th><th>Category</th><th>Competitions</th></tr>';
  sts.forEach((s,i)=>{const comps=stRegs(s.id).map(r=>{const c=gC(r.compId);return c?c.name:'';}).filter(Boolean).join(', ');ct+='<tr><td>'+(i+1)+'</td><td>'+s.chest+'</td><td>'+s.name+'</td><td>'+gCatN(s.category)+'</td><td>'+comps+'</td></tr>';});
  ct+='</table>';
  pdfWin((t?t.name:'')+' — Participation List',ct);
};

/* ================================================================
   TEAM: IMPORT/EXPORT
   ================================================================ */
function tImportExport(mc,team) {
  mc.innerHTML=
    '<div class="sh"><h2>💾 Import / Export</h2></div>'+
    '<div class="two-col">'+
      '<div class="glass" style="padding:24px">'+
        '<h3>📤 Export Team Data</h3>'+
        '<p style="color:var(--t3);margin:10px 0;font-size:.88rem">Download your team\'s students and registrations</p>'+
        '<button class="btn-primary" onclick="exportTeam(\''+team.id+'\')">📥 Download Team Backup</button>'+
      '</div>'+
      '<div class="glass" style="padding:24px">'+
        '<h3>📥 Import Students</h3>'+
        '<p style="color:var(--t3);margin:10px 0;font-size:.88rem">Upload a JSON file — <strong>replaces ALL your students</strong></p>'+
        '<input type="file" id="timFile" accept=".json" style="margin:10px 0"><br>'+
        '<button class="btn-warning" onclick="importTeam(\''+team.id+'\')">⬆️ Import & Replace</button>'+
      '</div>'+
    '</div>';
}

window.exportTeam = function(tid) {
  const t=gT(tid),sts=tmSts(tid),sids=sts.map(s=>s.id);
  const data={team:{name:t.name},students:sts,registrations:S.registrations.filter(r=>sids.includes(r.studentId)),results:S.results.filter(r=>sids.includes(r.studentId)),attendance:S.attendance.filter(a=>sids.includes(a.studentId)),marks:(S.marks||[]).filter(m=>sids.includes(m.studentId))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='team_'+t.name.replace(/\s+/g,'_')+'_backup.json';a.click();
  toast('Team data exported! 📥','success');
};

window.importTeam = function(tid) {
  const file=document.getElementById('timFile')?.files[0];
  if(!file){toast('Please select a JSON file','error');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.students){toast('Invalid file — no students data','error');return;}
      if(!confirm('This will REPLACE all your current students. Continue?'))return;
      const old=tmSts(tid).map(s=>s.id);
      S.students=S.students.filter(s=>s.teamId!==tid);
      S.registrations=S.registrations.filter(r=>!old.includes(r.studentId));
      S.attendance=S.attendance.filter(a=>!old.includes(a.studentId));
      S.results=S.results.filter(r=>!old.includes(r.studentId));
      S.marks=(S.marks||[]).filter(m=>!old.includes(m.studentId));
      const idMap={};
      data.students.forEach(s=>{const ni=uid();idMap[s.id]=ni;S.students.push({...s,id:ni,teamId:tid});});
      if(data.registrations)data.registrations.forEach(r=>{const ni=idMap[r.studentId];if(ni&&gC(r.compId))S.registrations.push({...r,id:uid(),studentId:ni});});
      saveState();render();toast('Students imported! 💾','success');
    }catch{toast('Invalid JSON file','error');}
  };
  reader.readAsText(file);
};

/* ================================================================
   STUDENT PUBLIC PROFILE (URL: ?student=ID)
   ================================================================ */
function renderStudentPublic(sid) {
  const s=gS(sid);
  const app=document.getElementById('app');
  if(!s){
    app.innerHTML='<div class="login-page"><div class="glass" style="padding:40px;text-align:center"><div style="font-size:3rem;margin-bottom:12px">❓</div><h2>Student Not Found</h2><p style="color:var(--t3);margin:12px 0">The student with this ID does not exist.</p><button class="btn-secondary" onclick="location.href=location.pathname">← Go to Login</button></div></div>'+footerH();
    return;
  }
  const tm=gT(s.teamId),regs=stRegs(sid),res=stRes(sid);
  app.innerHTML=
    '<div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - var(--fh));padding:20px">'+
      '<div class="student-profile glass">'+
        (S.config.logo?'<img src="'+S.config.logo+'" style="height:52px;border-radius:10px;margin-bottom:12px" onerror="this.style.display=\'none\'">':'')+
        '<div style="font-size:.83rem;color:var(--t3);margin-bottom:10px">'+esc(S.config.eventName)+'</div>'+
        qrSVG(location.href,140)+
        '<div class="chest-big">'+esc(s.chest)+'</div>'+
        '<h2 style="margin:10px 0;font-size:1.6rem">'+esc(s.name)+'</h2>'+
        '<div><span class="badge bc">'+gCatN(s.category)+'</span></div>'+
        '<div style="color:var(--t2);font-weight:600;margin:8px 0">'+(tm?esc(tm.name):'')+'</div>'+
        (regs.length?
          '<h3 style="margin:16px 0 12px">Competitions</h3>'+
          '<div class="tbl-wrap"><table style="text-align:left"><thead><tr><th>Competition</th><th>Position</th><th>Points</th><th>Grade</th></tr></thead><tbody>'+
            regs.map(r=>{const c=gC(r.compId),result=res.find(x=>x.compId===r.compId);return'<tr><td>'+(c?esc(c.name):'?')+'</td><td>'+(result?result.position:'-')+'</td><td>'+(result?result.points:'-')+'</td><td>'+(result&&result.grade?esc(result.grade):'-')+'</td></tr>';}).join('')+
          '</tbody></table></div>'+
          '<div style="margin-top:16px;font-size:1.2rem;font-weight:800">Total Points: <span class="grad">'+stPts(sid)+'</span></div>'
        :'<p style="color:var(--t3)">No competitions registered yet</p>')+
        '<button class="btn-secondary" onclick="printChestCard(\''+s.id+'\')" style="margin-top:20px">🪪 Print Chest Card</button> '+
        '<button class="btn-secondary" onclick="location.href=location.pathname" style="margin-top:20px">← Back to Login</button>'+
      '</div>'+
    '</div>'+footerH();
}

/* ================================================================
   START

render();
hydrateFromServer(); // pull latest data from the server after first paint
</script>
