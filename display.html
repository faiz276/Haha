<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Scoreboard Display</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--acc:#ff8c00}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:#0c0c1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:3vh 3vw;overflow-x:hidden;background-image:radial-gradient(circle at 15% 10%,rgba(255,140,0,.14),transparent 45%),radial-gradient(circle at 85% 90%,rgba(255,61,0,.12),transparent 45%)}
.topbar{display:flex;align-items:center;gap:16px;width:100%;max-width:1200px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{font-size:3rem}
.logo img{height:64px;border-radius:14px}
.brand h1{font-size:clamp(1.4rem,3.4vw,2.6rem);font-weight:900;letter-spacing:.01em}
.brand p{opacity:.65;font-size:clamp(.85rem,1.6vw,1.1rem);font-weight:600}
.live{display:flex;align-items:center;gap:10px;font-weight:800}
.dot{width:14px;height:14px;border-radius:50%;background:#2ecc71;box-shadow:0 0 12px #2ecc71;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.clock{font-size:clamp(1rem,2vw,1.4rem);font-weight:800;opacity:.85;font-variant-numeric:tabular-nums}
.ribbon{margin:2.4vh 0 2vh;text-align:center;font-size:clamp(1.6rem,4.5vw,3.2rem);font-weight:900;background:linear-gradient(135deg,var(--acc),#ff3d00);-webkit-background-clip:text;background-clip:text;color:transparent}
.board{width:100%;max-width:1200px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:18px;padding:18px 26px;animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.row.top1{background:linear-gradient(135deg,rgba(255,215,0,.22),rgba(255,140,0,.12));border-color:gold;box-shadow:0 0 34px rgba(255,215,0,.25)}
.row.top2{background:linear-gradient(135deg,rgba(192,192,192,.20),rgba(255,255,255,.05));border-color:silver}
.row.top3{background:linear-gradient(135deg,rgba(205,127,50,.22),rgba(255,140,0,.08));border-color:#cd7f32}
.rank{font-size:clamp(1.8rem,4.5vw,3rem);font-weight:900;min-width:90px;text-align:center}
.nm{flex:1;min-width:0}
.nm strong{display:block;font-size:clamp(1.3rem,3.2vw,2.2rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm span{opacity:.6;font-size:clamp(.85rem,1.8vw,1.1rem);font-weight:600}
.pts{font-size:clamp(1.8rem,4.5vw,3rem);font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums}
.pts small{display:block;font-size:.75rem;color:#fff;opacity:.55;font-weight:700;letter-spacing:.1em;text-align:right}
.empty{text-align:center;opacity:.6;padding:8vh 0;font-size:1.3rem}
.footer{margin-top:auto;padding-top:3vh;display:flex;gap:14px;align-items:center;opacity:.65;font-size:.95rem;font-weight:600;flex-wrap:wrap;justify-content:center}
.footer button{cursor:pointer;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;padding:9px 18px;font-weight:700;font-size:.9rem;font-family:inherit}
.footer button:hover{background:rgba(255,255,255,.16)}
@media(max-width:640px){.rank{min-width:60px}.row{padding:14px 16px;gap:12px}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo" id="logo">🕌</div>
    <div><h1 id="evName">Scoreboard</h1><p id="orgName"></p></div>
  </div>
  <div class="live"><span class="dot"></span>LIVE <span class="clock" id="clock"></span></div>
</div>
<div class="ribbon">🏆 Overall Rankings 🏆</div>
<div class="board" id="board"><div class="empty">Loading scores…</div></div>
<div class="footer">
  <span id="upd"></span>
  <button onclick="load(true)">↻ Refresh now</button>
  <button onclick="toggleFS()">⛶ Fullscreen</button>
</div>
<script>
'use strict';
var API_URL='api.php', API_KEY='change-me-please', KEY='pollappp_v2_state';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function tmPts(S,tid){
  var p=0;
  (S.results||[]).forEach(function(r){var st=(S.students||[]).find(function(x){return x.id===r.studentId;});if(!st||st.teamId!==tid)return;p+=(+r.points||0);});
  (S.bonus||[]).forEach(function(b){if(b.teamId===tid)p+=(+b.points||0);});
  return p;
}
function render(S){
  document.documentElement.style.setProperty('--acc',(S.config&&S.config.accentColor)||'#ff8c00');
  document.title=((S.config&&S.config.eventName)||'Scoreboard')+' — Live';
  document.getElementById('evName').textContent=(S.config&&S.config.eventName)||'Scoreboard';
  document.getElementById('orgName').textContent=(S.config&&S.config.orgName)||'';
  var lg=document.getElementById('logo');
  if(S.config&&S.config.logo){lg.innerHTML='<img src="'+S.config.logo+'" onerror="this.outerHTML=\'🕌\'">';}
  else lg.textContent=(S.config&&S.config.icon)||'🕌';
  var teams=(S.teams||[]).map(function(t){
    var n=(S.students||[]).filter(function(s){return s.teamId===t.id;}).length;
    return {name:t.name,students:n,pts:tmPts(S,t.id)};
  }).sort(function(a,b){return b.pts-a.pts;});
  var bd=document.getElementById('board');
  if(!teams.length){bd.innerHTML='<div class="empty">No teams yet</div>';return;}
  var medals=['🥇','🥈','🥉'];
  bd.innerHTML=teams.map(function(t,i){
    var cls=i===0?'top1':i===1?'top2':i===2?'top3':'';
    return '<div class="row '+cls+'"><div class="rank">'+(i<3?medals[i]:'#'+(i+1))+'</div>'+
      '<div class="nm"><strong>'+esc(t.name)+'</strong><span>'+t.students+' students</span></div>'+
      '<div class="pts">'+t.pts+'<small>POINTS</small></div></div>';
  }).join('');
  document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString();
}
function local(){try{var d=localStorage.getItem(KEY);if(d)return JSON.parse(d);}catch(e){}return null;}
function load(manual){
  fetch(API_URL,{headers:{'X-Api-Key':API_KEY}}).then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(d&&d.config){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}render(d);}
    else{var l=local();if(l)render(l);}
  }).catch(function(){var l=local();if(l)render(l);});
}
function tick(){var c=document.getElementById('clock');if(c)c.textContent=new Date().toLocaleTimeString();}
function toggleFS(){if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}else{document.exitFullscreen&&document.exitFullscreen();}}
window.toggleFS=toggleFS;window.load=load;
load();tick();setInterval(tick,1000);setInterval(load,10000);
window.addEventListener('storage',function(e){if(e.key===KEY&&e.newValue){try{render(JSON.parse(e.newValue));}catch(_){}}});
</script>
</body>
</html>
